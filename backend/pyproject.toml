[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blunderlog-backend"
version = "0.1.0"
description = "BlunderLog API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.6",
    "httpx>=0.25.2",
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.2",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
