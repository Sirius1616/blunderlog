version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: blunderlog
      POSTGRES_PASSWORD: blunderlog
      POSTGRES_DB: blunderlog
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://blunderlog:blunderlog@db:5432/blunderlog
      - STOCKFISH_PATH=/app/bin/stockfish
    volumes:
      - ./bin:/app/bin
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  pg_data:
